
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question For You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            color: red;
        }

        .container {
            background-color: black;
            padding: 50px;
            border-radius: 30px;
            max-width: 600px;
            width: 90%;
            transition: all 0.5s ease;
            border: 2px solid red;
        }

        h1 {
            color: red;
            font-size: 3rem;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            border: 2px solid red;
            background-color: black;
            color: red;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        button:hover {
            background-color: red;
            color: black;
            transform: scale(1.05);
        }

        #no-btn {
            position: absolute;
            left: 50%;
            transform: translateX(50%);
        }

        /* Hearts animation */
        .heart {
            position: absolute;
            color: red;
            font-size: 2rem;
            animation: floatUp 4s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h1 id="question">Do you love me?</h1>
        <div class="buttons">
            <button id="yes-btn" onclick="nextPage()">Yes</button>
            <button id="no-btn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
        </div>
    </div>

    <script>
        function moveNoButton() {
            const noBtn = document.getElementById('no-btn');
            
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;

            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;

            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        function nextPage() {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <h1 style="color: red;">I love you too! ❤️</h1>
            `;

            for (let i = 0; i < 100; i++) {
                createHeart();
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.fontSize = (Math.random() * 2 + 1) + 'rem';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>
</body>
</html>
